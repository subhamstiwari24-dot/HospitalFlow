# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hospitalflow
spring.datasource.username=postgres
spring.datasource.password=shubham123

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Run the non-destructive schema synchronisation before Hibernate starts.
spring.sql.init.mode=always

# Optional email delivery. When MAIL_HOST is empty, development OTP mode is used.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
hospitalflow.mail.from=${MAIL_FROM:no-reply@hospitalflow.local}
hospitalflow.otp.dev-mode=${OTP_DEV_MODE:true}

# Server
server.port=8080